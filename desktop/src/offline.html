<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Faircroft RP</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:#eaf7ff;background:radial-gradient(circle at 50% 0,#142743,#070b12 55%);font:14px/1.5 "Segoe UI",sans-serif}.card{width:min(440px,calc(100% - 40px));padding:34px;text-align:center;border:1px solid #253c53;border-radius:24px;background:#0b1522;box-shadow:0 30px 80px #0008}.mark{width:72px;height:72px;margin:auto;display:grid;place-items:center;border-radius:22px;background:linear-gradient(145deg,#08c9e8,#7068ff 52%,#f51b94);font-size:22px;font-weight:900;font-style:italic;box-shadow:0 15px 38px #1767a955}h1{margin:20px 0 5px;font-size:25px}p{margin:0 0 24px;color:#8499ab}button{padding:11px 19px;color:#effcff;border:1px solid #2d6377;border-radius:11px;background:#123246;font-weight:800;cursor:pointer}small{display:block;margin-top:18px;color:#4f6577}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">FC</div>
      <h1>Faircroft is temporarily offline</h1>
      <p>The desktop client could not reach Faircroft services. Check your connection and try again.</p>
      <button id="retry">Reconnect</button>
      <small>Your account and game connection have not been changed.</small>
    </main>
    <script>document.getElementById("retry").addEventListener("click",()=>window.faircroftDesktop.retry())</script>
  </body>
</html>
